add_newline = false

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$sudo\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$c\
$cmake\
$dotnet\
$golang\
$java\
$kotlin\
$nodejs\
$python\
$rlang\
$ruby\
$rust\
$swift\
$time"""

[directory]
read_only = " 󰌾"
style = "blue"

[directory.substitutions]
Desktop = ""
Documents = "󰈙"
Downloads = ""
Music = "󰝚"
Pictures = ""
Public = ""
Templates = ""
Videos = ""

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "on [$symbol$branch]($style)"
symbol = " "
style = "bright-black"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed )]($style)"
style = "cyan"
conflicted = " =$count"
untracked = " ?$count"
modified = " !$count"
staged = " +$count"
renamed = " »$count"
deleted = " ✘$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
stashed = "≡"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[c]
symbol = " "

[cmake]
symbol = " "

[dotnet]
format = "via [$symbol($version )(󰓾 $tfm )]($style)"
symbol = "󰪮 "

[golang]
symbol = " "

[java]
symbol = " "

[kotlin]
symbol = " "

[nodejs]
symbol = " "

[python]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = "󱘗 "

[swift]
symbol = " "

[os]
disabled = false

