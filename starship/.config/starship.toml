add_newline = false
palette = "catppuccin_mocha"

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$sudo\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$c\
$cmake\
$dotnet\
$golang\
$java\
$kotlin\
$nodejs\
$python\
$rlang\
$ruby\
$rust\
$swift\
$time"""

[directory]
read_only = " 󰌾"
style = "bold blue"

[directory.substitutions]
Desktop = ""
Documents = "󰈙"
Downloads = ""
Music = "󰝚"
Pictures = ""
Public = ""
Templates = ""
Videos = ""

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "on [$symbol$branch]($style)"
symbol = " "
style = "green"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](yellow) ($ahead_behind$stashed )]($style)"
style = "green"
conflicted = " =$count"
untracked = " ?$count"
modified = " !$count"
staged = " +$count"
renamed = " »$count"
deleted = " ✘$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
stashed = "≡"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
style = "red"

[cmd_duration]
format = "[$duration]($style) "
style = "overlay1"

[c]
symbol = " "
style = "blue"

[cmake]
symbol = " "
style = "text"

[dotnet]
format = "via [$symbol($version )(󰓾 $tfm )]($style)"
symbol = "󰪮 "
style = "mauve"

[golang]
symbol = " "
style = "sky"

[java]
symbol = " "
style = "red"

[kotlin]
symbol = " "
style = "mauve"

[nodejs]
symbol = " "
style = "green"

[python]
symbol = " "
style = "yellow"

[rlang]
symbol = "󰟔 "
style = "blue"

[ruby]
symbol = " "
style = "red"

[rust]
symbol = "󱘗 "
style = "text"

[swift]
symbol = " "
style = "peach"

[os]
disabled = false
style = "text"

